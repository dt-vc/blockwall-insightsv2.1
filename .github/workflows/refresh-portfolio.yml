name: Refresh portfolio updates

# Runs the portfolio collector and commits the regenerated data/portfolio/** tree
# + data/portfolio.json rollup. Mirrors the Substack refresh pattern; touches ONLY
# portfolio data, never the daily/weekly/monthly editions. X/Twitter stays skipped
# unless a TWITTER_BEARER_TOKEN secret is added later.

on:
  schedule:
    - cron: "40 */6 * * *"  # every 6h at :40 past 00/06/12/18 UTC. Knob: "40 6 * * *" = daily, "0 */3 * * *" = every 3h
  workflow_dispatch: {}      # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-portfolio
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect portfolio updates
        run: node scripts/collect-portfolio-updates.js
      - name: Commit if changed
        run: |
          git add data/portfolio data/portfolio.json
          if git diff --cached --quiet; then
            echo "No portfolio changes."
          else
            git config user.name "blockwall-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh portfolio updates"
            git pull --rebase --autostash origin main
            git push
          fi
