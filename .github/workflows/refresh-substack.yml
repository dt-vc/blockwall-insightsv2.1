name: Refresh Substack posts

# Keeps data/substack.json in sync with the live Substack archive
# (https://insights.blockwall.vc). The Substack API has no CORS header, so the
# site can't fetch it in the browser — this does it server-side and commits the
# static JSON that the homepage carousel already renders. Touches ONLY
# data/substack.json; does not interfere with the daily/weekly/monthly pipeline.

on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC
  workflow_dispatch: {}     # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-substack
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest Substack posts
        run: node scripts/fetch-substack.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/substack.json; then
            echo "No change to data/substack.json."
          else
            git config user.name "blockwall-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/substack.json
            git commit -m "chore: refresh Substack posts"
            git pull --rebase --autostash origin main
            git push
          fi
