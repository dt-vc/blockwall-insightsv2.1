<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Insights Archive | Blockwall</title>
  <link rel="icon" type="image/png" href="../assets/images/blockwall-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-theme="dark">
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-brand">
        <img src="../assets/images/blockwall-logo.png" alt="Blockwall" class="nav-logo">
        <span class="nav-brand-text">Blockwall Insights</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Daily</a>
        <a href="../weekly/index.html" class="nav-link">Weekly</a>
        <a href="../monthly/index.html" class="nav-link">Monthly</a>
        <a href="../portfolio/index.html" class="nav-link">Portfolio</a>
        <a href="../saved.html" class="nav-link">Saved</a>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </nav>

  <main class="archive-container">
    <a href="../index.html" class="back-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Back to Home
    </a>

    <div class="archive-header">
      <h1 class="archive-title">Daily Insights</h1>
      <p class="archive-subtitle">Archive of all daily newsletters. Click any edition to read.</p>
    </div>

    <div class="daily-grid" id="daily-grid">
      <!-- Cards loaded dynamically from daily.json -->
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading...</div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand">
      <img src="../assets/images/blockwall-logo.png" alt="Blockwall" class="footer-logo">
      <span>Blockwall Capital</span>
    </div>
    <p class="footer-text">European Crypto Venture Capital • Frankfurt, Germany</p>
  </footer>

  <script>
    // Theme toggle
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('theme-icon');
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        icon.textContent = '☀️';
        localStorage.setItem('bw-theme', 'light');
      } else {
        body.setAttribute('data-theme', 'dark');
        icon.textContent = '🌙';
        localStorage.setItem('bw-theme', 'dark');
      }
    }
    
    const savedTheme = localStorage.getItem('bw-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    const FALLBACK_THUMB = 'https://images.unsplash.com/photo-1639762681057-408e52192e55?w=400&h=200&fit=crop';

    // Format an id like 2026-06-11 for display (fallback when date_display is absent)
    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
                      'July', 'August', 'September', 'October', 'November', 'December'];
      return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }

    // Load and render daily cards from the v2 manifest
    // (entries: { id, type, date_display, title, sources, bullish, bearish, thumbnail, snippet })
    async function loadDailyCards() {
      const grid = document.getElementById('daily-grid');

      try {
        const response = await fetch('../data/daily.json');
        if (!response.ok) throw new Error('Failed to load data');

        const dailyData = await response.json();

        if (!dailyData || dailyData.length === 0) {
          grid.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">No newsletters available yet.</div>';
          return;
        }

        // Sort by edition id descending (ids are ISO dates → newest first)
        dailyData.sort((a, b) => b.id < a.id ? -1 : b.id > a.id ? 1 : 0);

        grid.innerHTML = dailyData.map((item, index) => `
          <a href="../daily.html?id=${encodeURIComponent(item.id)}" class="daily-card">
            <div class="daily-card-image">
              <img src="${escapeHtml(item.thumbnail || FALLBACK_THUMB)}" alt="${escapeHtml(item.date_display || formatDate(item.id))}" onerror="this.src='${FALLBACK_THUMB}'">
              ${index === 0 ? '<div class="daily-card-badge">Latest</div>' : ''}
            </div>
            <div class="daily-card-content">
              <div class="daily-card-date">${escapeHtml(item.date_display || formatDate(item.id))}</div>
              <h3 class="daily-card-title">${escapeHtml(item.title)}</h3>
              <p class="daily-card-snippet">${escapeHtml(item.snippet)}</p>
              <div class="daily-card-stats">
                <span class="daily-card-stat">📊 ${escapeHtml(item.sources)} sources</span>
                <span class="daily-card-stat bullish">🟢 ${escapeHtml(item.bullish)}</span>
                <span class="daily-card-stat bearish">🔴 ${escapeHtml(item.bearish)}</span>
              </div>
            </div>
          </a>
        `).join('');

      } catch (error) {
        console.error('Error loading daily data:', error);
        grid.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            Unable to load newsletters. Please refresh the page.
          </div>
        `;
      }
    }

    // Load on page ready
    document.addEventListener('DOMContentLoaded', loadDailyCards);
  </script>
<!-- Floating Feedback Button -->
  <div class="feedback-float">
    <a href="https://forms.gle/EG5rQ4H1SAhjuiqT6" target="_blank" class="feedback-btn" title="Share your feedback">
      <span class="feedback-badge">Beta</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <line x1="9" y1="9" x2="15" y2="9"></line>
        <line x1="9" y1="13" x2="13" y2="13"></line>
      </svg>
      <span class="feedback-btn-text">Share Feedback</span>
    </a>
  </div>

</body>
</html>
